# Địa chỉ IP mặc định của Chat Server
server.ip=127.0.0.1

# Cổng (Port) mặc định của Chat Server
server.port=8888

# Thời gian chờ kết nối tối đa (milliseconds)
connection.timeout=5000

# Thời gian gửi gói PING giữ kết nối định kỳ (15 giây = 15000 milliseconds)
heartbeat.interval=15000

# Số chu kỳ PING liên tiếp không nhận được PONG thì kích hoạt cờ mất mạng
heartbeat.max.missed=3
